[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatmesh"
version = "0.1.0"
description = "MVP natural-language-to-Gmsh workflow support for FDEM mesh generation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm Noncommercial License 1.0.0" }
authors = [
  { name = "chatMesh contributors" }
]
dependencies = []

[project.scripts]
chatmesh = "chatmesh.cli:main"

[tool.setuptools.packages.find]
where = ["plugins/chatmesh/python"]
include = ["chatmesh*"]

[tool.pytest.ini_options]
pythonpath = ["plugins/chatmesh/python"]
